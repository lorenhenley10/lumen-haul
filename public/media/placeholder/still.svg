<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Photograph not yet published">
  <!--
    The stand-in frame. Used wherever a photograph has not been supplied yet.

    It reads as an UNEXPOSED FRAME, not as a wireframe: a soft off-centre sheen,
    fine emulsion grain, and a vignette to settle the edges. The previous
    version drew rule-of-thirds guides and a boxed "STILL" label, which is the
    look of a layout comp — fine in a spec, wrong on a portfolio that is live.

    No text. The one thing worth saying is said in HTML, where it can use the
    site's own typeface instead of a generic monospace fallback.

    Composition is centred and edge-free so an `object-cover` crop to any ratio
    takes nothing with it.
  -->
  <defs>
    <radialGradient id="sheen" cx="38%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#3a3a3a" />
      <stop offset="52%" stop-color="#212121" />
      <stop offset="100%" stop-color="#141414" />
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5" />
    </radialGradient>

    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise" />
      <!-- Chroma is 0 across this site's palette; the grain has to match. -->
      <feColorMatrix in="noise" type="saturate" values="0" result="grey" />
      <feComponentTransfer in="grey">
        <feFuncA type="linear" slope="0.09" />
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sheen)" />
  <rect width="1600" height="900" filter="url(#grain)" />
  <rect width="1600" height="900" fill="url(#vignette)" />
</svg>
